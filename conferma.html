<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ordine ricevuto — FÉRÈA</title><style>body{margin:0;background:#fffaf4;color:#2b241f;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:60px auto;padding:30px;text-align:center}.logo{width:130px;height:130px;object-fit:cover}h1{font:45px Georgia,serif;letter-spacing:3px}.card{background:#f3e8da;padding:30px;margin:35px 0;text-align:left;line-height:1.8}.btn{display:inline-block;background:#211b18;color:#fff;text-decoration:none;padding:16px 25px;letter-spacing:2px}.small{font-size:12px;color:#74685f}</style></head><body><div class='wrap'><img class='logo' src='logo.jpeg'><h1>GRAZIE PER AVER SCELTO FÉRÈA</h1><p>Il tuo ordine di prova è stato ricevuto con successo!</p><div class='card' id='order'></div><p class='small'>Questa è una simulazione del prototipo: nessun ordine o pagamento è stato realmente inviato.</p><a class='btn' href='abiti.html'>CONTINUA A FARE SHOPPING</a></div><script>let o=JSON.parse(localStorage.getItem('fereaOrder')||'null');document.getElementById('order').innerHTML=o?`<b>${o.name}</b> × ${o.qty}<br>Taglia: ${o.size} · Colore: ${o.color}<br>Consegna: ${o.ship}<br>Pagamento: ${o.pay}`:'Ordine di prova completato.';</script></body></html>
