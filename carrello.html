<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Carrello — FÉRÈA</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#2b241f;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:45px 25px}.logo{width:110px;height:110px;object-fit:cover}h1{font:42px Georgia,serif;letter-spacing:3px;border-bottom:1px solid #d8cabc;padding-bottom:20px}.item{display:grid;grid-template-columns:130px 1fr auto;gap:25px;padding:25px 0;border-bottom:1px solid #ddd0c2}.pic{height:170px;background:url('https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=80') center/cover}.qty button{padding:7px 11px;background:none;border:1px solid #aaa}.total{text-align:right;font-size:20px;margin:30px 0}.cta{display:block;margin-left:auto;width:310px;text-align:center;padding:17px;background:#211b18;color:#fff;text-decoration:none;letter-spacing:2px}.secondary{display:block;text-align:right;margin-top:16px;color:inherit}.empty{text-align:center;padding:70px 0}@media(max-width:600px){.item{grid-template-columns:90px 1fr}.item>div:last-child{grid-column:2}.cta{width:100%}}</style></head><body><div class='wrap'><a href='index.html'><img class='logo' src='logo.jpeg'></a><h1>IL TUO CARRELLO</h1><div id='cart'></div></div><script>function draw(){let c=JSON.parse(localStorage.getItem('fereaCart')||'null'),el=document.getElementById('cart');if(!c){el.innerHTML='<div class="empty"><h2>IL TUO CARRELLO È VUOTO</h2><p>La tua prossima scelta FÉRÈA ti aspetta.</p><a class="cta" style="margin:30px auto" href="abiti.html">SCOPRI LA COLLEZIONE</a></div>';return}el.innerHTML=`<div class="item"><div class="pic"></div><div><h2>${c.name}</h2><p>Colore: ${c.color}<br>Taglia: ${c.size}</p><div class="qty"><button onclick="q(-1)">−</button> &nbsp;${c.qty}&nbsp; <button onclick="q(1)">+</button></div><p><a href="#" onclick="del()">Rimuovi</a></p></div><div>€ ${(c.price*c.qty).toFixed(2).replace('.',',')}</div></div><div class="total">TOTALE &nbsp; <b>€ ${(c.price*c.qty).toFixed(2).replace('.',',')}</b></div><a class="cta" href="checkout.html">VAI ALLA CASSA</a><a class="secondary" href="abiti.html">CONTINUA LO SHOPPING</a>`}function q(n){let c=JSON.parse(localStorage.getItem('fereaCart'));c.qty+=n;if(c.qty<1)return del();localStorage.setItem('fereaCart',JSON.stringify(c));draw()}function del(){localStorage.removeItem('fereaCart');draw()}draw();</script></body></html>
