<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Checkout — FÉRÈA</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#2b241f;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px 25px}.logo{width:100px;height:100px;object-fit:cover}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:55px}h1{font:42px Georgia,serif;letter-spacing:3px}.box{border-top:1px solid #d7c9bc;padding:20px 0}input{width:100%;padding:13px;margin:6px 0;border:1px solid #c8bbae;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:block;border:1px solid #c8bbae;padding:15px;margin:9px 0;background:#fff}.summary{background:#f3e8da;padding:25px;height:max-content}.pay{width:100%;padding:17px;background:#211b18;color:white;border:0;letter-spacing:2px;margin-top:20px;cursor:pointer}.small{font-size:12px;color:#74685f;line-height:1.6}@media(max-width:750px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}</style></head><body><div class='wrap'><a href='index.html'><img class='logo' src='logo.jpeg'></a><h1>CHECKOUT</h1><div class='grid'><form id='form'><div class='box'><b>1 · INFORMAZIONI DI CONTATTO</b><input required type='email' placeholder='Email'></div><div class='box'><b>2 · INDIRIZZO DI SPEDIZIONE</b><div class='two'><input required placeholder='Nome'><input required placeholder='Cognome'></div><input required placeholder='Indirizzo'><div class='two'><input required placeholder='CAP'><input required placeholder='Città'></div></div><div class='box'><b>3 · METODO DI CONSEGNA</b><label class='option'><input type='radio' name='ship' value='Standard' checked style='width:auto'> Spedizione standard — € 4,90 <span class='small'>(esempio)</span></label><label class='option'><input type='radio' name='ship' value='Ritiro in sede' style='width:auto'> Ritiro in sede — GRATUITO</label></div><div class='box'><b>4 · METODO DI PAGAMENTO</b><label class='option'><input type='radio' name='pay' value='Carta' checked style='width:auto'> Carta <span class='small'>(simulazione)</span></label><label class='option'><input type='radio' name='pay' value='PayPal' style='width:auto'> PayPal <span class='small'>(simulazione)</span></label><label class='option'><input type='radio' name='pay' value='Pagamento alla consegna' style='width:auto'> Pagamento alla consegna<br><span class='small'>Solo Nocera Superiore, Nocera Inferiore, Pagani e Cava de’ Tirreni. Pagamento in contanti al corriere.</span></label></div><button class='pay'>CONFERMA ORDINE DI PROVA</button></form><aside class='summary'><h2>IL TUO ORDINE</h2><div id='sum'></div><p class='small'>Questo checkout è un prototipo: non viene effettuato alcun pagamento reale.</p></aside></div></div><script>let c=JSON.parse(localStorage.getItem('fereaCart')||'null');if(!c)location.href='carrello.html';else document.getElementById('sum').innerHTML=`<p><b>${c.name}</b> × ${c.qty}<br>${c.color} · ${c.size}</p><hr><p>Prodotti: € ${(c.price*c.qty).toFixed(2).replace('.',',')}</p><p>Spedizione: definita dal metodo scelto</p>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let pay=new FormData(e.target).get('pay'),ship=new FormData(e.target).get('ship');localStorage.setItem('fereaOrder',JSON.stringify({...c,pay,ship}));localStorage.removeItem('fereaCart');location.href='conferma.html'};</script></body></html>
